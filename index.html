  ================================================================
  File: index.html
  Author: Cole Perkins
  Date Created: March 28, 2026 (refactored April 1, 2026)
  Last Modified: April 12, 2026
  Description: Entry point for the CARE Garden application.
               Loads all libraries and scripts in dependency order.
  ================================================================
-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CARE Garden</title>
  <link rel="stylesheet" type="text/css" href="style.css">

  <!-- Core libraries -->
  
  
  <!-- Each library loads from its CDN; if the network is down the copy
       saved next to this page is used instead, so the garden still starts. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script>window.p5 || document.write('<script src="p5.min.js"><\/script>')</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
  <script>(window.p5 && p5.SoundFile) || document.write('<script src="p5.sound.min.js"><\/script>')</script>
  <script src="https://cdn.jsdelivr.net/gh/ml5js/Intro-ML-Arts-IMA@ml5-build-10-7-19/ml5_build/ml5.min.js"></script>
  <script>window.ml5 || document.write('<script src="ml5.min.js"><\/script>')</script>
  <!-- The photo moderation library (nsfwjs) loads in moderation.html, in a
       hidden frame of its own: it cannot share a page with ml5. -->

  <!-- 0. PX pixel-art engine and master palette (no p5 calls) -->
  <script src="js/pixel.js"></script>

  <!-- 0b. Sprite art: PX.define(...) only, no p5 calls at load time -->
  <script src="js/art/scene_art.js"></script>
  <script src="js/art/town_art.js"></script>
  <script src="js/art/weather_art.js"></script>
  <script src="js/art/animals_art.js"></script>
  <script src="js/art/people_art.js"></script>
  <script src="js/art/flowers_art.js"></script>
  <script src="js/art/hats_art.js"></script>
  <script src="js/art/ui_art.js"></script>

  <!-- 1. Constants & shared data (no p5 calls — safe at parse time) -->
  <script src="js/constants.js"></script>

  <!-- 2. Global state declarations -->
  <script src="js/globals.js"></script>

  <!-- 2b. Safe sound playback helpers -->
  <script src="js/audio.js"></script>

  <!-- 3. World / coordinate helpers -->
  <script src="js/world.js"></script>

  <!-- 4. Scene drawing -->
  <script src="js/scene.js"></script>

  <!-- 4b. Town backdrop -->
  <script src="js/town.js"></script>

  <!-- 5. Weather system -->
  <script src="js/weather.js"></script>

  <!-- 6. Flowers -->
  <script src="js/flowers.js"></script>

  <!-- 7. Flying creatures -->
  <script src="js/creatures.js"></script>

  <!-- 8. UI — panels, gallery, speech bubbles, confetti -->
  <script src="js/ui.js"></script>

  <!-- 9. Face detection -->
  <script src="js/facedetection.js"></script>

  <!-- 10. Characters -->
  <script src="js/characters/ram.js"></script>
  <script src="js/characters/gardener.js"></script>
  <script src="js/characters/kids.js"></script>
  <script src="js/characters/goose.js"></script>
  <script src="js/characters/cat.js"></script>
  <script src="js/characters/rabbit.js"></script>
  <script src="js/characters/mrperkins.js"></script>
  <script src="js/characters/groundhog.js"></script>
  <script src="js/characters/principal.js"></script>
  <script src="js/characters/mrconant.js"></script>
  <script src="js/characters/teacher.js"></script>

  <!-- 11. Main sketch — setup() and draw() -->
  <script src="sketch.js"></script>
</head>
<body>
</body>
</html>
